name: BudBuddy visual checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run gameplay and responsive tests
        run: npm test
      - name: Upload playthrough recordings, screenshots, traces and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budbuddy-visual-checks
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
